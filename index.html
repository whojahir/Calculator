<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="calculator">
    <input type="text" class="calculator__screen" placeholder="0" disabled />

    <div class="calculator__buttons">
      <button class="btn btn--action">AC</button>
      <button class="btn btn--action">DEL</button>
      <button class="btn btn--operator">/</button>
      <button class="btn btn--operator">×</button>

      <button class="btn">7</button>
      <button class="btn">8</button>
      <button class="btn">9</button>
      <button class="btn btn--operator">+</button>

      <button class="btn">4</button>
      <button class="btn">5</button>
      <button class="btn">6</button>
      <button class="btn btn--operator">-</button>

      <button class="btn">1</button>
      <button class="btn">2</button>
      <button class="btn">3</button>
      <button class="btn btn--equals">=</button>

      <button class="btn btn--zero">0</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
